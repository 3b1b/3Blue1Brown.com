      <path d="M0-4L9 0L0 4Z" fill="#f4ca5f"/>
    </marker>
    <marker id="arrow-mint" viewBox="0 -4 9 8" refX="8" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0-4L9 0L0 4Z" fill="#5de0ae"/>
    </marker>
    <g id="particle">
      <circle r="9" fill="currentColor" opacity="0.13"/>
      <circle r="4" fill="#fff9e8" stroke="currentColor" stroke-width="1.5"/>
    </g>
    <g id="collision">
      <circle r="3.2" fill="#fff8df" stroke="currentColor" stroke-width="1.2"/>
    </g>
    <g id="branch-node">
      <circle r="10" fill="currentColor" opacity="0.14"/>
      <circle r="5" fill="#fff9e8" stroke="currentColor" stroke-width="2"/>
    </g>
    <g id="absorption">
      <circle r="8" fill="#f4ca5f" opacity="0.1"/>
      <circle r="6" fill="none" stroke="#f4ca5f" stroke-width="1.4" opacity="0.8"/>
      <path d="M-3.5-3.5L3.5 3.5M3.5-3.5L-3.5 3.5" fill="none" stroke="#fff4cd" stroke-width="1.4"/>
    </g>
  </defs>

  <g id="background-layer">
    <rect width="1200" height="800" fill="url(#background)"/>
  </g>

  <g id="problem-copy" fill="#e8f5f3" font-family="Inter, Avenir Next, Avenir, Helvetica, Arial, sans-serif">
    <text id="problem-title" x="70" y="78" font-size="34" font-weight="600" letter-spacing="0.8">Critical Spheres</text>
    <line x1="70" y1="105" x2="505" y2="105" stroke="#73d9e4" stroke-width="1" opacity="0.38"/>
    <g id="model-rules" font-size="16.2" opacity="0.88">
      <g id="rule-1">
        <circle cx="80" cy="139" r="3.2" fill="#f1ca67"/>
        <text x="98" y="144">
          <tspan x="98" dy="0">Particles diffuse independently inside a sphere of radius R,</tspan>
          <tspan x="98" dy="23">with diffusion coefficient D.</tspan>
        </text>
      </g>
      <g id="rule-2">
        <circle cx="80" cy="194" r="3.2" fill="#f1ca67"/>
        <text x="98" y="199">
          <tspan x="98" dy="0">Particles interact with nuclei in the sphere's material, but do not</tspan>
          <tspan x="98" dy="23">interact with one another.</tspan>
        </text>
      </g>
      <g id="rule-3">
        <circle cx="80" cy="249" r="3.2" fill="#f1ca67"/>
        <text x="98" y="254">An interaction has one of three outcomes:</text>
        <g id="interaction-outcomes" font-size="15.4">
          <circle cx="110" cy="276" r="2.1" fill="none" stroke="#f1ca67" stroke-width="1.2"/>
          <text x="124" y="281">scattering at rate γ, which changes the particle's direction;</text>
          <circle cx="110" cy="301" r="2.1" fill="none" stroke="#f1ca67" stroke-width="1.2"/>
          <text x="124" y="306">absorption at rate α;</text>
          <circle cx="110" cy="326" r="2.1" fill="none" stroke="#f1ca67" stroke-width="1.2"/>
          <text x="124" y="331">
            <tspan x="124" dy="0">branching at rate β, replacing it with a mean of</tspan>
            <tspan x="124" dy="21" font-family="STIX Two Math, Cambria Math, Times New Roman, serif" font-size="16.7">𝜈</tspan><tspan dx="4">new particles.</tspan>
          </text>
        </g>
      </g>
      <g id="rule-4">
        <circle cx="80" cy="379" r="3.2" fill="#f1ca67"/>
        <text x="98" y="384">
          <tspan x="98" dy="0">A particle reaching the surface escapes and is removed</tspan>
          <tspan x="98" dy="23">permanently.</tspan>
        </text>
      </g>
    </g>
    <text id="challenge" x="70" y="442" font-size="22.5" font-weight="600">
      <tspan x="70" dy="0">Determine the critical radius R</tspan><tspan baseline-shift="sub" font-size="15">c</tspan><tspan baseline-shift="baseline" font-size="22.5"> at which</tspan>
      <tspan x="70" dy="30">the expected population of particles</tspan>
      <tspan x="70" dy="30">is constant.</tspan>
    </text>
    <g id="bonus">
      <rect x="58" y="525" width="458" height="170" rx="8" fill="#0d2635" fill-opacity="0.72" stroke="#e0b850" stroke-width="1" stroke-opacity="0.42"/>
      <text x="78" y="555" font-size="15.5" font-weight="700" letter-spacing="1.8" fill="#f1ca67">BONUS</text>
      <text id="bonus-copy" x="78" y="585" font-size="14.3" opacity="0.88">
        <tspan x="78" dy="0">Assume the material is very expensive, and you can</tspan>
        <tspan x="78" dy="21.5">procure enough to form only a sphere of radius κ R</tspan><tspan baseline-shift="sub" font-size="10.5">c</tspan><tspan baseline-shift="baseline" font-size="14.3">,</tspan>
        <tspan x="78" dy="21.5">where 0 &lt; κ &lt; 1 and R</tspan><tspan baseline-shift="sub" font-size="10.5">c</tspan><tspan baseline-shift="baseline" font-size="14.3"> is the critical radius</tspan>
        <tspan x="78" dy="21.5">found above. How could you modify the system to</tspan>
        <tspan x="78" dy="21.5">achieve criticality?</tspan>
      </text>
    </g>
    <text id="units-heading" x="70" y="723" font-size="13.5" font-weight="700" fill="#f1ca67" letter-spacing="0.7">Physical units:</text>
    <text id="units" x="70" y="748" font-size="15.5" fill="#9ee6e8" letter-spacing="0.2">
      <tspan x="70" dy="0">[D] = length²/time,</tspan>
      <tspan x="70" dy="23">[α] = [β] = [γ] = time⁻¹,   [</tspan><tspan font-family="STIX Two Math, Cambria Math, Times New Roman, serif">𝜈</tspan><tspan>] = dimensionless.</tspan>
    </text>
  </g>

  <g id="sphere-layer">
