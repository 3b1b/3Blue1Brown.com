<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="background" cx="58%" cy="46%" r="78%">
      <stop offset="0" stop-color="#0b1d2d"/>
      <stop offset="0.62" stop-color="#07131f"/>
      <stop offset="1" stop-color="#030811"/>
    </radialGradient>
    <radialGradient id="sphere-fill" cx="34%" cy="28%" r="78%">
      <stop offset="0" stop-color="#1b4657"/>
      <stop offset="0.48" stop-color="#102f40"/>
      <stop offset="0.82" stop-color="#081d2b"/>
      <stop offset="1" stop-color="#04111c"/>
    </radialGradient>
    <radialGradient id="sphere-vignette" cx="34%" cy="28%" r="76%">
      <stop offset="0.48" stop-color="#020812" stop-opacity="0"/>
      <stop offset="0.84" stop-color="#020812" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#020812" stop-opacity="0.68"/>
    </radialGradient>
    <radialGradient id="highlight" cx="42%" cy="42%" r="62%">
