      <stop offset="0.43" stop-color="#70dbe7"/>
      <stop offset="1" stop-color="#2d718b"/>
    </linearGradient>
    <linearGradient id="fade-top" gradientUnits="userSpaceOnUse" x1="820" y1="147" x2="754" y2="82">
      <stop offset="0" stop-color="#f4ca5f" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#f4ca5f" stop-opacity="0.14"/>
