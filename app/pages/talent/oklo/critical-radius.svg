      <circle cx="880" cy="400" r="260" fill="url(#sphere-vignette)"/>
      <g id="contours" fill="none" stroke="#8ee8ed">
        <ellipse id="equator" cx="880" cy="400" rx="259" ry="70" stroke-width="1.2" opacity="0.19"/>
        <ellipse id="meridian" cx="880" cy="400" rx="82" ry="259" transform="rotate(-14 880 400)" stroke-width="1.1" opacity="0.14"/>
      </g>
    </g>
  </g>

