<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="denseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6B7280;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4B5563;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hopperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blackwellGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#76B900;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5A8F00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="#0D0D0D"/>

  <!-- Title -->
  <text x="450" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Cost per 1M Tokens: Dense vs MoE</text>

  <!-- Y-axis labels -->
  <text x="55" y="115" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF" text-anchor="end">$1.00</text>
  <text x="55" y="190" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF" text-anchor="end">$0.75</text>
  <text x="55" y="265" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF" text-anchor="end">$0.50</text>
  <text x="55" y="340" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF" text-anchor="end">$0.25</text>
  <text x="55" y="415" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF" text-anchor="end">$0.00</text>

  <!-- Grid lines -->
  <line x1="70" y1="110" x2="850" y2="110" stroke="#374151" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="70" y1="185" x2="850" y2="185" stroke="#374151" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="70" y1="260" x2="850" y2="260" stroke="#374151" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="70" y1="335" x2="850" y2="335" stroke="#374151" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="70" y1="410" x2="850" y2="410" stroke="#374151" stroke-width="1"/>

  <!-- Bars - height calculation: $1.00 = 300px, so each $0.01 = 3px -->
  <!-- Dense Llama 405B FP8: $1.00 = 300px -->
  <rect x="120" y="110" width="100" height="300" rx="4" fill="url(#denseGrad)"/>
  <text x="170" y="95" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">$1.00</text>

  <!-- Maverick FP8 Hopper: $0.20 = 60px -->
  <rect x="280" y="350" width="100" height="60" rx="4" fill="url(#hopperGrad)"/>
  <text x="330" y="340" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#8B5CF6" text-anchor="middle">$0.20</text>
  <text x="330" y="320" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF" text-anchor="middle">5x cheaper</text>

  <!-- Maverick FP8 Blackwell: $0.10 = 30px -->
  <rect x="440" y="380" width="100" height="30" rx="4" fill="url(#blackwellGrad)"/>
  <text x="490" y="370" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#76B900" text-anchor="middle">$0.10</text>
  <text x="490" y="350" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF" text-anchor="middle">10x cheaper</text>

  <!-- Maverick FP4 Blackwell: $0.05 = 15px -->
  <rect x="600" y="395" width="100" height="15" rx="4" fill="url(#blackwellGrad)"/>
  <text x="650" y="385" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#76B900" text-anchor="middle">$0.05</text>
  <text x="650" y="365" font-family="Arial, sans-serif" font-size="12" fill="#76B900" text-anchor="middle">20x cheaper</text>

  <!-- X-axis labels -->
  <text x="170" y="435" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9CA3AF" text-anchor="middle">Dense 405B</text>
  <text x="170" y="452" font-family="Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">FP8 · H200</text>

  <text x="330" y="435" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MoE 400B</text>
  <text x="330" y="452" font-family="Arial, sans-serif" font-size="11" fill="#8B5CF6" text-anchor="middle">FP8 · H200</text>

  <text x="490" y="435" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MoE 400B</text>
  <text x="490" y="452" font-family="Arial, sans-serif" font-size="11" fill="#76B900" text-anchor="middle">FP8 · B200</text>

  <text x="650" y="435" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MoE 400B</text>
  <text x="650" y="452" font-family="Arial, sans-serif" font-size="11" fill="#76B900" text-anchor="middle">FP4 · B200</text>

  <!-- Footer note -->
  <text x="450" y="485" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">MoE 400B: 400B total params, 17B active per token.</text>

</svg>
