name: Test pull request

on:
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install packages
        run: bun install

      - name: SSH debug
        if: runner.debug == '1'
        uses: mxschmitt/action-tmate@v3

      - name: Run test
        run: bun run build

  test-types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install packages
        run: bun install

      - name: SSH debug
        if: runner.debug == '1'
        uses: mxschmitt/action-tmate@v3

      - name: Run test
        run: bun run test:types

  test-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install packages
        run: bun install

      - name: SSH debug
        if: runner.debug == '1'
        uses: mxschmitt/action-tmate@v3

      - name: Run test
        run: bun run test:lint

  test-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install packages
        run: bun install

      - name: SSH debug
        if: runner.debug == '1'
        uses: mxschmitt/action-tmate@v3

      - name: Run test
        run: bun run test:format

  test-e2e:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install packages
        run: bun install

      - name: SSH debug
        if: runner.debug == '1'
        uses: mxschmitt/action-tmate@v3

      - name: Install Playwright
        run: bun run install-playwright

      - name: Run test
        id: test
        run: bun run test:e2e

      - name: Parse results
        if: failure()
        id: parse-results
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const reportPath = "playwright-report/json/results.json";
            if (!fs.existsSync(reportPath)) {
              console.log(`No report found at ${reportPath}`);
              return;
            }
            const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
            const specs = report.suites?.flatMap((suite) => suite.specs ?? []) ?? [];
            console.log(`Found ${specs.length} specs`);
            const details = (title, body) =>
              `<details><summary>${title}</summary>\n\n${body}\n\n</details>`;
            const sections = specs.flatMap(({ file, title, tests }) =>
              tests
                .filter(({ status }) => status === "unexpected")
                .map(({ annotations }) =>
                  details(
                    `\`${file}\` - ${title}`,
                    annotations
                      .map(({ type, description = "" }) =>
                        details(type, `\`\`\`json\n${description}\n\`\`\``),
                      )
                      .join("\n\n"),
                  ),
                ),
            );
            console.log(`Found ${sections.length} unexpected test sections`);
            if (!sections.length) return;
            const body = ["**End-to-end test failures**", ...sections].join("\n\n");
            console.log(`Body length: ${body.length}`);
            core.setOutput("body", body);

      - name: Post comment
        if: >-
          !cancelled() &&
          (steps.test.outcome == 'success' || steps.parse-results.outputs.body)
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          message: ${{ steps.parse-results.outputs.body }}
          delete: ${{ steps.test.outcome == 'success' }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: |
            ./playwright-report
          retention-days: 30
